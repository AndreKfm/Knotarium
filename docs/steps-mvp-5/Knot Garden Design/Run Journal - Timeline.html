<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Run Journal — Connected Timeline</title>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0b1c2a"/><g><circle cx="30" cy="30" r="6" fill="#22d3ee"/><line x1="30" y1="36" x2="30" y2="54" stroke="#34d399" stroke-width="3"/><circle cx="30" cy="60" r="6" fill="#3b9eff"/><g stroke="#5a6675" stroke-width="3" stroke-linecap="round"><path d="M44 30h26M44 60h20"/></g></g></svg>
</template>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .tp-panel { width: 392px; background: #0a0e15; border: 1px solid #1b2533; border-radius: 16px; padding: 16px; color: #e6edf3; }

  /* header */
  .tp-head { display: flex; align-items: center; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid #161f2b; }
  .tp-head-l { display: flex; align-items: center; gap: 11px; }
  .tp-head-icon { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; font-size: 15px; color: #22d3ee; }
  .tp-head-title { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; }
  .tp-head-sub { font-size: 11px; color: #5d6b7c; margin-top: 2px; font-family: ui-monospace, Menlo, monospace; }
  .tp-status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 11px; border-radius: 999px; border: 1px solid; }
  .tp-status-pulse { width: 7px; height: 7px; border-radius: 50%; animation: tp-pulse 1.3s ease-in-out infinite; }

  /* trigger bar */
  .tp-trigbar { display: flex; align-items: center; gap: 10px; margin: 13px 0 4px; padding: 9px 12px; border-radius: 10px; font-size: 12px; }
  .tp-trigbar.auto { background: linear-gradient(90deg, rgba(34,211,238,0.1), rgba(34,211,238,0.02)); border: 1px solid rgba(34,211,238,0.22); }
  .tp-trigbar.manual { background: linear-gradient(90deg, rgba(124,92,255,0.12), rgba(124,92,255,0.02)); border: 1px solid rgba(124,92,255,0.26); }
  .tp-trigbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 6px; flex: none; }
  .tp-trigbar.auto .tp-trigbadge { color: #5fd9f0; background: rgba(34,211,238,0.16); }
  .tp-trigbar.manual .tp-trigbadge { color: #b6a3ff; background: rgba(124,92,255,0.18); }
  .tp-trigtxt { color: #9aa7b6; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

  /* rail */
  .tp-rail { display: flex; flex-direction: column; margin-top: 12px; }
  .tp-step { display: flex; gap: 13px; }
  .tp-step.faded { opacity: 0.5; }
  .tp-gutter { display: flex; flex-direction: column; align-items: center; flex: none; width: 34px; }

  .tp-disc { position: relative; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(var(--g),0.1); border: 1px solid rgba(var(--sg),0.45); box-shadow: 0 0 16px rgba(var(--sg),0.22); }
  .tp-disc.s-skipped { box-shadow: none; border-style: dashed; background: rgba(120,135,155,0.05); }
  .tp-disc.s-pending { box-shadow: none; }
  .tp-disc.s-running { animation: tp-discpulse 1.6s ease-in-out infinite; }
  .tp-badge { position: absolute; right: -5px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #0a0e15; }
  .tp-badge.b-completed { background: #34d399; }
  .tp-badge.b-failed { background: #f0556d; }
  .tp-badge.b-running { background: #22d3ee; }
  .tp-badge.b-pending, .tp-badge.b-skipped { background: #2a3340; }

  .tp-spin { width: 9px; height: 9px; border-radius: 50%; border: 2px solid rgba(10,14,21,0.4); border-top-color: #0a0e15; animation: tp-rot 0.7s linear infinite; }
  .tp-hollow { width: 7px; height: 7px; border-radius: 50%; border: 2px solid #5a6675; }
  .tp-skip-dash { width: 8px; height: 2px; border-radius: 2px; background: #5a6675; }

  .tp-line { width: 2px; flex: 1; min-height: 30px; margin: 4px 0; border-radius: 2px; }
  .tp-line.seg-done { background: linear-gradient(#34d399cc, #34d39955); }
  .tp-line.seg-active { background: repeating-linear-gradient(#22d3ee, #22d3ee 5px, transparent 5px, transparent 10px); animation: tp-flow 0.6s linear infinite; }
  .tp-line.seg-pending { background: #283142; }
  .tp-line.seg-dead { background: repeating-linear-gradient(#3a4252, #3a4252 3px, transparent 3px, transparent 7px); }

  /* node body */
  .tp-body { flex: 1; padding-bottom: 16px; min-width: 0; }
  .tp-row { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .tp-row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tp-name { font-size: 14px; font-weight: 650; color: #f1f5f9; }
  .tp-uid { font-size: 10.5px; color: #586374; font-family: ui-monospace, Menlo, monospace; }
  .tp-row-right { margin-left: auto; display: flex; align-items: center; gap: 9px; flex: none; }
  .tp-pill { font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .tp-ms { font-size: 11px; color: #7c8a9c; font-family: ui-monospace, Menlo, monospace; }
  .tp-chev { transition: transform 0.18s ease; }
  .tp-chev.open { transform: rotate(180deg); }

  .tp-summary { font-size: 12px; color: #8593a3; font-style: italic; margin-top: 6px; }

  .tp-detail { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .tp-ev { display: flex; align-items: baseline; gap: 9px; font-size: 12px; }
  .tp-evdot { width: 6px; height: 6px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .tp-evdot.start { background: #3b9eff; }
  .tp-evdot.done { background: #34d399; }
  .tp-evdot.fail { background: #f0556d; }
  .tp-evts { font-size: 10.5px; color: #4f5b6b; font-family: ui-monospace, Menlo, monospace; flex: none; }
  .tp-evtxt { color: #aeb9c6; }

  .tp-block { margin-top: 4px; border-radius: 9px; overflow: hidden; border: 1px solid #18222f; }
  .tp-block-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: #6b7785; padding: 7px 11px 5px; background: #0c1119; }
  .tp-block-body { margin: 0; padding: 8px 11px 10px; background: #070b12; font-size: 11.5px; color: #9fb0c2; font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; line-height: 1.5; }
  .tp-block.log .tp-block-body { color: #8fd3ff; }
  .tp-block.log .tp-block-label { color: #5b8fc0; }
  .tp-block.error { border-color: rgba(240,85,109,0.3); }
  .tp-block.error .tp-block-body { color: #ff9aab; background: #160a0d; }
  .tp-block.error .tp-block-label { color: #c06b78; background: #160a0d; }

  /* footer */
  .tp-foot { display: flex; align-items: center; gap: 9px; margin-top: 4px; padding: 11px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 600; }
  .tp-foot.completed { color: #6ee7b7; background: linear-gradient(90deg, rgba(52,211,153,0.13), rgba(52,211,153,0.03)); border: 1px solid rgba(52,211,153,0.22); }
  .tp-foot.running { color: #5fd9f0; background: linear-gradient(90deg, rgba(34,211,238,0.12), rgba(34,211,238,0.02)); border: 1px solid rgba(34,211,238,0.22); }
  .tp-foot.failed { color: #ff8497; background: linear-gradient(90deg, rgba(240,85,109,0.12), rgba(240,85,109,0.02)); border: 1px solid rgba(240,85,109,0.24); }
  .tp-foot-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(34,211,238,0.3); border-top-color: #22d3ee; animation: tp-rot 0.7s linear infinite; }
  .tp-foot-x { width: 16px; height: 16px; border-radius: 50%; background: rgba(240,85,109,0.2); color: #ff8497; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

  @keyframes tp-rot { to { transform: rotate(360deg); } }
  @keyframes tp-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  @keyframes tp-discpulse { 0%, 100% { box-shadow: 0 0 16px rgba(34,211,238,0.22); } 50% { box-shadow: 0 0 22px rgba(34,211,238,0.5); } }
  @keyframes tp-flow { to { background-position: 0 10px; } }

  .note { font-size: 12.5px; color: #4b5563; line-height: 1.55; max-width: 290px; }
  .note b { color: #1f2937; }
  .note .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: #047857; background: #d1fae5; padding: 1px 7px; border-radius: 999px; margin-bottom: 8px; }
  .note ul { margin: 6px 0 0; padding-left: 16px; }
  .note li { margin-bottom: 5px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/design-canvas.jsx"></script>
<script type="text/babel" src="frames/timeline-panel.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="merged" title="Connected timeline + expandable details" subtitle="B's rail · A's expand-for-details · click any node">
          <DCArtboard id="manual" label="Manual run — fired by hand, all passed" width={428} height={620}>
            <div style={{ padding: 18 }}><TimelinePanel run={RUNS.manual} /></div>
          </DCArtboard>
          <DCArtboard id="how" label="How it reads" width={330} height={620}>
            <div style={{ padding: 26 }}>
              <div className="note">
                <span className="tag">THE MERGE</span>
                <p><b>The rail shows the connection</b> — nodes are linked top-to-bottom, mirroring the canvas order.</p>
                <ul>
                  <li><b>Click any node</b> to expand its events + payload — including the <b>log message</b>.</li>
                  <li>The <b>connector segment</b> is colored by flow: solid green = passed, animated cyan = running into the next node, dashed gray = skipped/dead.</li>
                  <li>The <b>trigger banner</b> tells you instantly how the run started.</li>
                </ul>
                <p style={{ marginTop: 12 }}>→ See the next two runs for how state &amp; trigger mode differentiate.</p>
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="scenarios" title="Same component, different runs" subtitle="This is your scheduler question — AUTO vs MANUAL, and live / failed states">
          <DCArtboard id="live" label="Scheduled run — AUTO trigger, in progress" width={428} height={720}>
            <div style={{ padding: 18 }}><TimelinePanel run={RUNS.live} /></div>
          </DCArtboard>
          <DCArtboard id="failed" label="Scheduled run — AUTO trigger, failed midway" width={428} height={680}>
            <div style={{ padding: 18 }}><TimelinePanel run={RUNS.failed} /></div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
