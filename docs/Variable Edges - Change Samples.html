<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knot Garden — Variable Edges: change samples</title>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0e16"/><g><rect x="16" y="20" width="22" height="60" rx="5" fill="#11161f" stroke="#22d3ee"/><rect x="46" y="20" width="16" height="26" rx="3" fill="#11161f" stroke="#7c6cf0"/><rect x="46" y="54" width="16" height="26" rx="3" fill="#11161f" stroke="#f0b429"/><rect x="70" y="20" width="14" height="26" rx="3" fill="#11161f" stroke="#34d399"/><rect x="70" y="54" width="14" height="26" rx="3" fill="#11161f" stroke="#f0556d"/></g></svg>
</template>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0e16; --canvas: #090d14; --card: #0c111a;
    --node: #11161f; --node-line: #1d2532; --ink: #e6edf3;
    --muted: #6b7888; --faint: #44505f;
    --teal: #22d3ee; --green: #34d399; --red: #f0556d; --amber: #f0b429; --violet: #7c6cf0;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 40px 90px; }

  /* ---- header ---- */
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: 0.04em;
    font-size: 14px; margin-bottom: 30px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(140deg, #2dd4bf, #2563eb);
    display: grid; place-items: center; font-size: 15px; }
  .brand .dot { color: var(--teal); }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 14px; }
  .lede { font-size: 16px; line-height: 1.6; color: #aab4c2; max-width: 760px; margin: 0; }
  .lede b { color: var(--ink); font-weight: 600; }

  /* ---- changelog strip ---- */
  .log { margin: 38px 0 8px; display: grid; gap: 12px; }
  .log-row { display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px; border-radius: 14px;
    background: var(--card); border: 1px solid #161e29; }
  .log-row .nm { font-weight: 700; font-size: 14.5px; min-width: 188px; display: flex; align-items: center; gap: 9px; }
  .log-row .nm .pip { width: 9px; height: 9px; border-radius: 3px; transform: rotate(45deg); flex: none; }
  .log-row .tx { font-size: 13.5px; line-height: 1.55; color: #9aa6b4; }
  .log-row .tx b { color: #cdd6e2; font-weight: 600; }

  /* ---- section heads ---- */
  .sec { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); font-weight: 800;
    margin: 56px 0 18px; text-transform: uppercase; }

  /* ---- sample grid ---- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .tile { background: var(--card); border: 1px solid #161e29; border-radius: 18px; overflow: hidden; }
  .tile-cap { padding: 15px 20px 17px; border-top: 1px solid #131a24; }
  .tile-tags { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .tag { font-size: 9.5px; font-weight: 800; letter-spacing: 0.07em; padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; white-space: nowrap; }
  .tag.before { color: #f3a8b6; background: rgba(240,85,109,0.13); border: 1px solid rgba(240,85,109,0.3); }
  .tag.after  { color: #8ff0d8; background: rgba(52,211,153,0.13); border: 1px solid rgba(52,211,153,0.3); }
  .tag.option { color: #c3b9ff; background: rgba(124,108,240,0.14); border: 1px solid rgba(124,108,240,0.3); }
  .tag.inter  { color: #a5d8ff; background: rgba(56,150,235,0.14); border: 1px solid rgba(56,150,235,0.32); }
  .tile-title { font-size: 15.5px; font-weight: 700; }
  .tile-desc { font-size: 13px; line-height: 1.55; color: #93a0ae; margin-top: 7px; }
  .tile-desc .mono { color: #c3b9ff; font-size: 12px; }

  /* ---- mini canvas ---- */
  .mini { position: relative; width: 100%; height: 246px;
    background:
      radial-gradient(circle at 1px 1px, #141c28 1px, transparent 0) 0 0 / 22px 22px, var(--canvas); }
  .mn { position: absolute; background: linear-gradient(180deg, #121822, #0f141d);
    border: 1px solid var(--node-line); border-radius: 12px; padding: 9px 11px; }
  .mn.dash { border-style: dashed; }
  .mn.dim { opacity: 0.32; }
  .mn.lit { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac), 0 0 22px -6px var(--ac); }
  .mn.halo { border-color: var(--green); box-shadow: 0 0 0 1px rgba(52,211,153,0.6), 0 0 26px -6px rgba(52,211,153,0.7); }
  .mn-head { display: flex; align-items: center; gap: 7px; }
  .mn-ico { width: 14px; height: 14px; display: inline-flex; }
  .mn-title { font-size: 12px; font-weight: 700; }
  .mn-meta { font-size: 9.5px; color: var(--muted); margin-top: 3px; }
  .mn-method { font-size: 11px; font-weight: 700; color: var(--violet); margin-top: 4px; }
  .mn-outs { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .mn-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 600;
    padding: 3px 7px; border-radius: 7px; background: #0c121b; border: 1px solid #1c2531; color: #c2cbd8; }
  .mn-pill .od { width: 5px; height: 5px; border-radius: 50%; background: var(--oc); }
  .mn-ref { margin-top: 7px; display: flex; align-items: center; gap: 6px; }
  .mn-reflabel { font-size: 9px; color: var(--faint); }

  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

  /* token / box / diamond (mini) */
  .tok { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 7px;
    font-size: 10.5px; font-weight: 600; border: 1px solid; white-space: nowrap; color: #eaeef4;
    border-color: color-mix(in oklab, var(--tc) 55%, transparent);
    background: color-mix(in oklab, var(--tc) 16%, transparent); }
  .tok .gly { font-family: ui-monospace, Menlo, monospace; font-size: 9px; color: var(--tc); opacity: 0.85; }
  .tok .fix { color: var(--tc); opacity: 0.75; }
  .tok .vl { color: var(--tc); font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .tok.big { font-size: 12.5px; padding: 4px 10px; gap: 6px; }

  .lab { position: absolute; transform: translate(-50%, -50%); }
  .vbox { display: inline-flex; align-items: stretch; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--bc); background: #0d1019; box-shadow: 0 6px 16px -8px rgba(0,0,0,0.8); }
  .vbox .seg { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; }
  .vbox .seg.name { color: #e7ebf2; background: color-mix(in oklab, var(--bc) 13%, transparent); }
  .vbox .seg.name .gly { color: var(--bc); font-family: ui-monospace, Menlo, monospace; font-size: 10px; opacity: 0.85; }
  .vbox .seg.val { color: var(--bc); font-family: ui-monospace, Menlo, monospace; font-weight: 600; font-size: 10px;
    border-left: 1px solid color-mix(in oklab, var(--bc) 40%, transparent); }
  .dia { width: 11px; height: 11px; border-radius: 2px; transform: translate(-50%, -50%) rotate(45deg);
    background: var(--dc); border: 2px solid #0b0f17; box-shadow: 0 0 0 1px var(--dc); position: absolute; }

  /* comparison rows (label-treatment tiles) */
  .cmp { display: flex; flex-direction: column; gap: 0; height: 246px; }
  .cmp-row { flex: 1; display: flex; align-items: center; gap: 14px; padding: 0 24px; }
  .cmp-row + .cmp-row { border-top: 1px dashed #1b2430; }
  .cmp-k { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--faint); width: 74px; flex: none; text-transform: uppercase; }
  .cmp-arrow { color: #2f3a49; }
  .ref-raw { font-size: 11.5px; font-style: italic; color: #8b93a2; }
  .ref-raw .d { color: var(--violet); font-style: normal; font-weight: 700; }

  .foot { margin-top: 60px; padding-top: 22px; border-top: 1px solid #161e29; display: flex; gap: 10px;
    align-items: center; font-size: 13px; color: var(--muted); }
  .foot a { color: #8ff0d8; text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const TYPEC = { object: "#7c6cf0", number: "#f0b429", boolean: "#f0556d", string: "#34d399" };
const GLY   = { object: "{ }", number: "#", boolean: "?", string: "“ ”" };
const RUNID = "56d556lxr";
const raw = (o) => `httpRequest-${RUNID}_${o}`;

const Ico = {
  globe: (c="#22d3ee") => <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15 0 18M12 3c-2.6 2.6-2.6 15 0 18"/></svg>,
  doc: (c="#22d3ee") => <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>,
};

/* ---------- geometry for the mini canvas (fixed 560-wide content area) ---------- */
const MW = 558, MH = 246;
const N = {
  http:   { x: 22,  y: 56,  w: 152, h: 132 },
  logB:   { x: 372, y: 30,  w: 164, h: 62  },
  logS:   { x: 372, y: 154, w: 164, h: 62  },
};
const pOutHttp = [N.http.x + N.http.w, N.http.y + 92];   // data leaves near outputs band
const pCtrl    = [N.http.x + N.http.w, N.http.y + 28];
const pInB     = [N.logB.x, N.logB.y + N.logB.h/2];
const pInS     = [N.logS.x, N.logS.y + N.logS.h/2];
function bez([x1,y1],[x2,y2]) { const dx = Math.max(40, Math.abs(x2-x1)*0.5); return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`; }
function mid([x1,y1],[x2,y2]) { return [(x1+x2)/2, (y1+y2)/2]; }

function Token({ out, friendly, value, big }) {
  const type = ({ body:"object", statusCode:"number" })[out];
  const c = TYPEC[type];
  return (
    <span className={"tok"+(big?" big":"")} style={{ "--tc": c }}>
      <span className="gly">{GLY[type]}</span>
      {value !== undefined
        ? <span className="vl">{value}</span>
        : <span><span className="fix">$</span>{friendly ? out : raw(out)}</span>}
    </span>
  );
}

/* one mini graph; `variant` selects the treatment */
function Mini({ variant, traced, halo, friendly = true, showValue = false }) {
  const reveal = variant === "reveal";
  const bodyOn = traced === "all" || traced === "body";
  const statOn = traced === "all" || traced === "status";
  const litOf  = (k) => k === "body" ? bodyOn : statOn;
  const anyTrace = !!traced;
  const showEdge = (k) => reveal ? litOf(k) : true;       // reveal hides until traced
  const dimEdge  = (k) => anyTrace && !litOf(k);

  const edge = (k, a, b) => {
    if (!showEdge(k)) return null;
    const c = k === "body" ? TYPEC.object : TYPEC.number;
    const lit = litOf(k), dim = dimEdge(k);
    return <path key={k} d={bez(a,b)} fill="none" stroke={c} strokeWidth={lit?2.4:1.8}
      strokeDasharray="6 5" opacity={dim?0.16:(lit?1:0.5)}
      style={{ filter: lit ? `drop-shadow(0 0 5px ${c}88)` : "none" }} />;
  };

  const label = (k, a, b) => {
    // dots: collapsed diamond at midpoint by default (expands to a token only when traced)
    if (variant === "dots" && !litOf(k)) {
      const c = k==="body"?TYPEC.object:TYPEC.number; const m = mid(a,b);
      return <div key={k} className="dia" style={{ left:m[0], top:m[1], "--dc":c }} />;
    }
    if (!showEdge(k)) return null;
    const m = mid(a,b); const out = k==="body"?"body":"statusCode";
    const dim = dimEdge(k);
    if (variant === "boxes") {
      const c = k==="body"?TYPEC.object:TYPEC.number;
      const prev = k==="body" ? "<!doctype…" : "200";
      return (
        <div key={k} className="lab" style={{ left:m[0], top:m[1], opacity: dim?0.22:1 }}>
          <div className="vbox" style={{ "--bc": c }}>
            <span className="seg name"><span className="gly">{GLY[k==="body"?"object":"number"]}</span>{out}</span>
            <span className="seg val">{prev}</span>
          </div>
        </div>
      );
    }
    return (
      <div key={k} className="lab" style={{ left:m[0], top:m[1], opacity: dim?0.24:1 }}>
        <Token out={out} friendly={friendly} value={showValue ? (k==="body"?undefined:"200") : undefined} />
      </div>
    );
  };

  const httpRole = halo ? "halo" : ((variant==="reveal"&&traced==="all") ? "lit" : "");
  const dimNode = (k) => anyTrace && !litOf(k) && !(traced==="all");

  return (
    <div className="mini">
      <svg className="edges">
        {/* faint control flow for context */}
        <path d={bez(pCtrl, [pInB[0], pInB[1]-6])} fill="none" stroke="#26313f" strokeWidth="1.6" opacity={anyTrace?0.4:0.7} />
        <path d={bez([N.logB.x+N.logB.w/2, N.logB.y+N.logB.h], [N.logS.x+N.logS.w/2, N.logS.y])} fill="none" stroke="#26313f" strokeWidth="1.6" opacity={anyTrace?0.4:0.7} />
        {edge("body", pOutHttp, pInB)}
        {edge("status", pOutHttp, pInS)}
      </svg>

      <div className={"mn"+(httpRole?" "+httpRole:"")} style={{ left:N.http.x, top:N.http.y, width:N.http.w, "--ac":"#22d3ee" }}>
        <div className="mn-head"><span className="mn-ico">{Ico.globe()}</span><span className="mn-title">HTTP Request</span></div>
        <div className="mn-method">GET</div>
        <div className="mn-outs">
          <span className="mn-pill" style={{ "--oc": TYPEC.object }}><span className="od" />body</span>
          <span className="mn-pill" style={{ "--oc": TYPEC.number }}><span className="od" />statusCode</span>
        </div>
      </div>

      <div className={"mn dash"+(litOf("body")?" lit":"")+(dimNode("body")?" dim":"")} style={{ left:N.logB.x, top:N.logB.y, width:N.logB.w, "--ac":"#7c6cf0" }}>
        <div className="mn-head"><span className="mn-ico">{Ico.doc("#7c6cf0")}</span><span className="mn-title">Log</span></div>
        <div className="mn-ref">{friendly ? <Token out="body" friendly /> : <span className="ref-raw">"<span className="d">$</span>{raw("body")}"</span>}</div>
      </div>

      <div className={"mn dash"+(litOf("status")?" lit":"")+(dimNode("status")?" dim":"")} style={{ left:N.logS.x, top:N.logS.y, width:N.logS.w, "--ac":"#f0b429" }}>
        <div className="mn-head"><span className="mn-ico">{Ico.doc("#f0b429")}</span><span className="mn-title">Log</span></div>
        <div className="mn-ref">{friendly ? <Token out="statusCode" friendly /> : <span className="ref-raw">"<span className="d">$</span>{raw("statusCode")}"</span>}</div>
      </div>

      {label("body", pOutHttp, pInB)}
      {label("status", pOutHttp, pInS)}
    </div>
  );
}

/* label-treatment comparison tile */
function NameCompare() {
  return (
    <div className="cmp">
      <div className="cmp-row">
        <span className="cmp-k">Before</span>
        <span className="ref-raw">"<span className="d">$</span>{raw("body")}"</span>
      </div>
      <div className="cmp-row">
        <span className="cmp-k">After</span>
        <Token out="body" friendly big />
        <span className="cmp-arrow">↺ hover shows full id</span>
      </div>
    </div>
  );
}
function ValueCompare() {
  return (
    <div className="cmp">
      <div className="cmp-row">
        <span className="cmp-k">Expression</span>
        <Token out="statusCode" friendly big />
      </div>
      <div className="cmp-row">
        <span className="cmp-k">After run</span>
        <Token out="statusCode" friendly big value="200" />
        <span className="cmp-arrow">= resolved value</span>
      </div>
    </div>
  );
}

const TILES = [
  { tag:"before", tagL:"Before", title:"Value box on every wire",
    desc:<>The original: a dashed wire <b>and</b> a floating value box for each read — even though the Log node already names the variable inline. Legible at 2 nodes; crosses and occludes at scale.</>,
    node:<Mini variant="boxes" traced="all" /> },
  { tag:"option", tagL:"Option", title:"Compact dots",
    desc:<>Wires stay, but each box collapses to a small type‑colored diamond at the midpoint. Hover or select expands it back to the full token. Data layer present, but quiet.</>,
    node:<Mini variant="dots" traced={null} /> },
  { tag:"after", tagL:"Default ✦", title:"Reveal on select",
    desc:<>Canvas shows <b>execution flow only</b>. The inline token in each node names the variable, so the persistent data wire isn't needed. Calm by default.</>,
    node:<Mini variant="reveal" traced={null} /> },
  { tag:"inter", tagL:"Interaction", title:"Hover / click traces one path",
    desc:<>Hover an output chip, label, or node to trace just <b>its</b> dependency; everything unrelated dims. Click to <b>pin</b> it lit while you work elsewhere.</>,
    node:<Mini variant="reveal" traced="body" /> },
  { tag:"inter", tagL:"Interaction", title:"Producer halo on hover",
    desc:<>Now symmetric on nodes too: hovering a consuming Log lights its incoming wire and glows its source <b>HTTP Request</b> node green — answers “where did this come from?” without following the line.</>,
    node:<Mini variant="reveal" traced="status" halo /> },
  { tag:"after", tagL:"After", title:"Trace a producer's full fan‑out",
    desc:<>Hovering/selecting the <b>HTTP Request</b> node reveals every variable it feeds at once — the inverse view of a single consumer.</>,
    node:<Mini variant="reveal" traced="all" /> },
  { tag:"option", tagL:"Label", title:"Friendly names",
    desc:<>Auto‑generated ids like <span className="mono">$httpRequest‑56d556lxr_body</span> alias down to the output name. Full id still available on hover.</>,
    node:<NameCompare /> },
  { tag:"option", tagL:"Label", title:"Show resolved value",
    desc:<>After a run, any token can swap from the expression to its resolved value in place — <span className="mono">statusCode → 200</span>.</>,
    node:<ValueCompare /> },
];

const LOG = [
  { c:"#f0556d", nm:"Problem", tx:<>Each global read was drawn <b>three times</b> — inline token + dashed wire + floating value box. Redundant, and it tangles as workflows grow.</> },
  { c:"#34d399", nm:"Reveal on select", tx:<>New default. Data wires are hidden; the canvas carries <b>execution flow</b> only. Hover or click a node/output to surface its reads.</> },
  { c:"#7c6cf0", nm:"Boxes · Dots · Reveal", tx:<>Three switchable density modes so teams can choose always‑on, collapsed, or on‑demand data wiring.</> },
  { c:"#3896eb", nm:"Hover / click symmetry", tx:<>Hover = transient trace, click = pin. Now works on <b>nodes</b> too, with a green <b>producer halo</b> back to the source.</> },
  { c:"#f0b429", nm:"Friendly names + values", tx:<>Long auto‑ids alias to the output name; tokens can show the resolved value after a run.</> },
];

function App() {
  return (
    <div className="wrap">
      <div className="brand"><span className="logo">🪢</span>KNOT&nbsp;GARDEN<span className="dot">.</span></div>
      <h1>Variable edges — what changed</h1>
      <p className="lede">Optimizing how a node's promoted outputs are shown as <b>global‑variable reads</b>. The goal: keep references legible in large workflows without the dashed‑wire spaghetti and floating value boxes.</p>

      <div className="log">
        {LOG.map((r,i) => (
          <div className="log-row" key={i}>
            <span className="nm"><span className="pip" style={{ background:r.c }} />{r.nm}</span>
            <span className="tx">{r.tx}</span>
          </div>
        ))}
      </div>

      <div className="sec">Samples</div>
      <div className="grid">
        {TILES.map((tl,i) => (
          <div className="tile" key={i}>
            {tl.node}
            <div className="tile-cap">
              <div className="tile-tags">
                <span className={"tag "+tl.tag}>{tl.tagL}</span>
              </div>
              <div className="tile-title">{tl.title}</div>
              <div className="tile-desc">{tl.desc}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="foot">
        ▸ These are static samples. The live, interactive version is in
        <a href="Variable Edges - Optimized.html">Variable Edges - Optimized.html</a>
        — use the Tweaks panel to switch modes.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
