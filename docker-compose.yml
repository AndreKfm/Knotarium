# Quick self-host: `docker compose up --build`, then open http://localhost:43120
#
# Credentials work out of the box — the at-rest encryption key auto-generates onto the
# knotarium-data volume on first run and stays stable across restarts. Set
# KNOTARIUM_ENCRYPTION_KEY only to bring your own key (e.g. to share one key across instances):
#   export KNOTARIUM_ENCRYPTION_KEY="$(openssl rand -base64 32)"
#
# The older KG_-prefixed names (KG_ENCRYPTION_KEY, KG_SIGNING_KEY, KG_AUTH_ENABLED) are still
# honoured as a fallback so an existing .env keeps working, but they are deprecated and will be
# dropped in a future release. These names exist only for Compose interpolation — they are not
# application settings. The app itself reads the canonical names on the right-hand side below.

services:
  knotarium:
    build: .
    image: knotarium:local
    ports:
      - "43120:43120"
    environment:
      # Optional: bring your own at-rest credential key. Left empty, the app auto-generates and
      # persists one on the /data volume. If you set it, keep it stable — saved credentials
      # encrypted under a previous key can't be decrypted.
      Security__Credentials__EncryptionKeyBase64: "${KNOTARIUM_ENCRYPTION_KEY:-${KG_ENCRYPTION_KEY:-}}"
      # Optional: only needed to SIGN exported bundles. Generate a base64 key if you use bundle export.
      Security__PackageSigning__HostPrivateKeyBase64: "${KNOTARIUM_SIGNING_KEY:-${KG_SIGNING_KEY:-}}"
      # Auth is ON by default (first run creates the admin). Set to "false" only for a throwaway local try.
      Auth__Enabled: "${KNOTARIUM_AUTH_ENABLED:-${KG_AUTH_ENABLED:-true}}"
    volumes:
      - knotarium-data:/data
    restart: unless-stopped

volumes:
  knotarium-data:
