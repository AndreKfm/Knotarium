# Quick self-host: `docker compose up --build`, then open http://localhost:8080
#
# Before first run, set a credential-encryption key (any 32-byte base64 value):
#   export KG_ENCRYPTION_KEY="$(openssl rand -base64 32)"
# It's used to encrypt stored credentials at rest — keep it stable across restarts,
# or previously-saved credentials can't be decrypted.

services:
  knotgarden:
    build: .
    image: knotgarden:local
    ports:
      - "8080:8080"
    environment:
      # Required for the credential store. Generate once, keep stable. (App still boots without it;
      # you just can't save credentials until it's set.)
      Security__Credentials__EncryptionKeyBase64: "${KG_ENCRYPTION_KEY:-}"
      # Optional: only needed to SIGN exported bundles. Generate a base64 key if you use bundle export.
      Security__PackageSigning__HostPrivateKeyBase64: "${KG_SIGNING_KEY:-}"
      # Auth is ON by default (first run creates the admin). Set to "false" only for a throwaway local try.
      Auth__Enabled: "${KG_AUTH_ENABLED:-true}"
    volumes:
      - knotgarden-data:/data
    restart: unless-stopped

volumes:
  knotgarden-data:
