# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
# See the header of AndreKaufmann.Knotarium.installer.yaml — these three files are the one-time seed
# for the first winget-pkgs submission, not a per-release artifact.
PackageIdentifier: AndreKaufmann.Knotarium
PackageVersion: 1.0.0
PackageLocale: en-US
Publisher: Andre Kaufmann
PublisherUrl: https://github.com/AndreKfm
PublisherSupportUrl: https://github.com/AndreKfm/Knotarium/issues
PackageName: Knotarium
PackageUrl: https://github.com/AndreKfm/Knotarium
License: Apache-2.0
LicenseUrl: https://github.com/AndreKfm/Knotarium/blob/main/LICENSE
Copyright: Copyright (c) Andre Kaufmann
ShortDescription: Self-hosted visual workflow automation server.
Description: >-
  Knotarium is a self-hosted, node-based workflow automation server. Build workflows on a visual
  canvas and run them on a local .NET engine — HTTP, database, file, email, schedule, polling and
  AI nodes, with inline C# and subflows. Installs and runs as a Windows service.
Moniker: knotarium
Tags:
  - automation
  - workflow
  - self-hosted
  - no-code
  - integration
# No Documentations entry on purpose: the manual ships inside the product (served at /help on the
# instance itself) and has no public URL. Every URL in a manifest is fetched by the validation
# pipeline, so a localhost address here would fail with URL-Validation-Error. Add one only if the
# help is ever published to a reachable host.
ManifestType: defaultLocale
ManifestVersion: 1.12.0
