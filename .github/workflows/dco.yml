name: DCO

# Enforces the Developer Certificate of Origin: every non-merge commit in a PR
# must carry a `Signed-off-by:` trailer. Self-contained (no third-party GitHub
# App) so the check lives in this repo alongside the rest of CI. See CONTRIBUTING.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          checked=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            # Merge commits have no meaningful authorship to certify — skip them.
            parents=$(git rev-list --parents -n1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              continue
            fi
            checked=$((checked + 1))
            author=$(git show -s --format='%an <%ae>' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")

            if [ -z "$signoffs" ]; then
              echo "::error::Commit $sha ($subject) is missing a Signed-off-by line."
              fail=1
              continue
            fi
            # At least one sign-off must match the commit author (case-insensitive).
            if ! printf '%s\n' "$signoffs" | grep -qiF "$author"; then
              echo "::error::Commit $sha ($subject): no Signed-off-by matches the author '$author'."
              echo "         sign-off(s) present: $(printf '%s' "$signoffs" | tr '\n' ';')"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "DCO check failed. Sign off your commits, then force-push:"
            echo "    git rebase --signoff $BASE_SHA && git push --force-with-lease"
            echo "New commits: use 'git commit -s'."
            exit 1
          fi
          echo "DCO OK — $checked commit(s) signed off."
