name: Release

# Builds and publishes the distribution artifacts (zip + Windows installer) whenever a
# version tag is pushed, e.g.  git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#
# Tags containing a hyphen (v1.0.0-rc.1, v1.0.0-beta.2) are marked as pre-releases.

on:
  push:
    tags:
      - 'v*'
  # Allow a manual dry run from the Actions tab (builds artifacts, skips the release upload).
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # For a tag push GITHUB_REF_NAME is the tag (v1.0.0-rc.1); for a manual run fall back to 0.0.0-dev.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # Pre-release when the version carries a hyphenated suffix (rc/beta/alpha).
          if [[ "${VER}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build zip + installer
        shell: pwsh
        run: ./publish.ps1 -Version '${{ steps.ver.outputs.version }}' -Zip -Installer

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: knotarium-${{ steps.ver.outputs.version }}
          path: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256
