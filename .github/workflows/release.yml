name: Release

# Builds and publishes the distribution artifacts whenever a version tag is pushed,
# e.g.  git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#   - Windows: zip + Inno Setup installer (registers a Windows service)
#   - Linux:   self-contained linux-x64 .tar.gz (preserves the executable bit)
# Both jobs attach their assets to the same GitHub Release.
#
# Tags containing a hyphen (v1.0.0-rc.1, v1.0.0-beta.2) are marked as pre-releases.

on:
  push:
    tags:
      - 'v*'
  # Allow a manual dry run from the Actions tab (builds artifacts, skips the release upload).
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # For a tag push GITHUB_REF_NAME is the tag (v1.0.0-rc.1); for a manual run fall back to 0.0.0-dev.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # Pre-release when the version carries a hyphenated suffix (rc/beta/alpha).
          if [[ "${VER}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build zip + installer
        shell: pwsh
        # Optional Authenticode signing: set the CODE_SIGN_PFX_BASE64 (base64 of a .pfx) and
        # CODE_SIGN_PFX_PASSWORD repo secrets to sign the app EXEs + installer. Unset ⇒ empty ⇒ publish.ps1
        # skips signing and builds exactly as before. This is the durable fix for the unsigned-build AV
        # false positives; an EV cert clears SmartScreen/Defender immediately, an OV cert over a ramp.
        env:
          SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: ./publish.ps1 -Version '${{ steps.ver.outputs.version }}' -Zip -Installer

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: knotarium-${{ steps.ver.outputs.version }}
          path: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256

  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # For a tag push GITHUB_REF_NAME is the tag (v1.0.0-rc.1); for a manual run fall back to 0.0.0-dev.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # Pre-release when the version carries a hyphenated suffix (rc/beta/alpha).
          if [[ "${VER}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build linux-x64 folder
        shell: pwsh
        run: ./publish.ps1 -Version '${{ steps.ver.outputs.version }}' -Runtime linux-x64

      - name: Package tarball
        shell: bash
        run: |
          VER='${{ steps.ver.outputs.version }}'
          NAME="Knotarium-${VER}-linux-x64"
          # Ensure the self-contained apphost is executable inside the archive.
          chmod +x "publish/app/Knotarium.Api"
          mv "publish/app" "publish/${NAME}"
          # tar.gz (not zip) so the executable bit survives extraction on Linux.
          ( cd publish && tar -czf "${NAME}.tar.gz" "${NAME}" && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: knotarium-${{ steps.ver.outputs.version }}-linux-x64
          path: |
            publish/*.tar.gz
            publish/*.tar.gz.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            publish/*.tar.gz
            publish/*.tar.gz.sha256

  # Scans the published artifacts on VirusTotal and appends the multi-engine scan links to the release
  # notes — so users hitting an unsigned-build heuristic warning can see the independent verdict.
  #
  # Opt-in and fail-safe: it does nothing unless a free VirusTotal API key is present in the VT_API_KEY
  # repo secret (https://www.virustotal.com/gui/my-apikey). Without the secret every step is skipped, and
  # the scan step is continue-on-error, so a missing key, a VT outage, or a rate-limit can never fail a
  # release. Runs after both build jobs so it can reach the uploaded artifacts and edit the finished notes.
  virustotal:
    name: VirusTotal scan
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the release notes
      actions: read     # download this run's build artifacts
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Check for a VirusTotal API key
        id: gate
        run: |
          if [ -n "${VT_API_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No VT_API_KEY secret configured; skipping the VirusTotal scan."
          fi

      - name: Download build artifacts
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Scan artifacts with VirusTotal
        id: vt
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true   # a VT outage or rate-limit must never fail a release
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4   # stay within the free public API's 4 lookups/minute
          # Only the distributables, not the tiny .sha256 sidecars. The action uses VirusTotal's
          # large-file upload endpoint, so the ~46-65 MB assets are within limits.
          files: |
            dist/**/*.zip
            dist/**/*setup.exe
            dist/**/*.tar.gz

      - name: Append VirusTotal links to the release notes
        if: steps.gate.outputs.enabled == 'true' && steps.vt.outcome == 'success' && steps.vt.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          # steps.vt.outputs.analysis is "path=url,path=url,…". Append a markdown section to the notes,
          # skipping if a re-run already added one.
          current="$(gh release view "$TAG" --json body -q .body)"
          if printf '%s' "$current" | grep -qF '### VirusTotal scans'; then
            echo "VirusTotal section already present; leaving the notes unchanged."
            exit 0
          fi
          {
            printf '%s\n\n' "$current"
            echo '### VirusTotal scans'
            echo ''
            echo 'Independent multi-engine VirusTotal scans of the artifacts in this release. Unsigned pre-release builds can trigger a heuristic (`!ml`) false-positive on Windows Defender/SmartScreen; verify the published SHA-256 and these scans.'
            echo ''
            IFS=',' read -ra items <<< "$ANALYSIS"
            for item in "${items[@]}"; do
              path="${item%%=*}"
              url="${item##*=}"
              echo "- [\`$(basename "$path")\`]($url)"
            done
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
