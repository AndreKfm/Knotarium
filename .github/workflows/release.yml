name: Release

# Builds and publishes the distribution artifacts whenever a version tag is pushed,
# e.g.  git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#   - Windows: zip + Inno Setup installer (registers a Windows service)
#   - Linux:   self-contained linux-x64 .tar.gz (preserves the executable bit)
# Both jobs attach their assets to the same GitHub Release.
#
# Tags containing a hyphen (v1.0.0-rc.1, v1.0.0-beta.2) are marked as pre-releases.

on:
  push:
    tags:
      - 'v*'
  # Allow a manual dry run from the Actions tab (builds artifacts, skips the release upload).
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and upload assets
  actions: read     # SignPath's action reads this run's uploaded build artifact for server-side signing

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # For a tag push GITHUB_REF_NAME is the tag (v1.0.0-rc.1); for a manual run fall back to 0.0.0-dev.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # Pre-release when the version carries a hyphenated suffix (rc/beta/alpha).
          if [[ "${VER}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build zip + installer
        shell: pwsh
        # Optional Authenticode signing: set the CODE_SIGN_PFX_BASE64 (base64 of a .pfx) and
        # CODE_SIGN_PFX_PASSWORD repo secrets to sign the app EXEs + installer. Unset ⇒ empty ⇒ publish.ps1
        # skips signing and builds exactly as before. This is the durable fix for the unsigned-build AV
        # false positives; an EV cert clears SmartScreen/Defender immediately, an OV cert over a ramp.
        env:
          SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: ./publish.ps1 -Version '${{ steps.ver.outputs.version }}' -Zip -Installer

      - name: Upload build artifacts (always)
        id: upload_windows
        uses: actions/upload-artifact@v7
        with:
          name: knotarium-${{ steps.ver.outputs.version }}
          path: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256

      # ── Optional SignPath Foundation (free OSS) code signing ────────────────────────────────────────
      # Server-side Authenticode signing via SignPath's GitHub trusted-build-system integration. This is
      # an ALTERNATIVE to the local PFX hook in "Build zip + installer" above — use one or the other, not
      # both. Opt-in and fail-safe: the steps below run only when the SIGNPATH_API_TOKEN secret AND the
      # SIGNPATH_ORGANIZATION_ID repo variable are set; otherwise they are skipped and the release
      # publishes the unsigned build exactly as before.
      #
      # One-time maintainer setup (https://app.signpath.io — requires a public repo + OSI license):
      #   1. Add the predefined "GitHub.com" trusted build system to your SignPath organization and link
      #      it to the project.
      #   2. Create a project, a signing policy (e.g. "release-signing"), and an artifact configuration
      #      that signs the setup.exe AND the *.exe files inside the .zip (SignPath signs within archives).
      #   3. Install the SignPath GitHub App and grant it access to this repository.
      #   4. Create an API token for a user with submitter permission.
      #   5. Add repo secret:    SIGNPATH_API_TOKEN
      #      Add repo variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #                          SIGNPATH_SIGNING_POLICY_SLUG, and (optional) SIGNPATH_ARTIFACT_CONFIGURATION_SLUG.
      - name: SignPath gate
        id: signpath_gate
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN}" ] && [ -n "${SIGNPATH_ORGANIZATION_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath not configured (SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID missing); publishing the unsigned build."
          fi

      - name: Submit SignPath signing request
        id: signpath_sign
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'default artifact configuration' }}
          github-artifact-id: ${{ steps.upload_windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish-signed

      - name: Swap in signed artifacts and refresh checksums
        if: steps.signpath_gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # SignPath returns the signed distributables under publish-signed/. Replace the unsigned
          # zip/installer with them, then regenerate the .sha256 sidecars from the SIGNED bytes — signing
          # changes the file hash, so the originals are stale. Matches publish.ps1's "<HASH>  <name>" format.
          Get-ChildItem publish-signed -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*setup.exe' } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path 'publish' $_.Name) -Force }
          Get-ChildItem publish -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*setup.exe' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -Encoding ascii
            }

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            publish/*.zip
            publish/*.zip.sha256
            publish/*setup.exe
            publish/*setup.exe.sha256

  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          # For a tag push GITHUB_REF_NAME is the tag (v1.0.0-rc.1); for a manual run fall back to 0.0.0-dev.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # Pre-release when the version carries a hyphenated suffix (rc/beta/alpha).
          if [[ "${VER}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build linux-x64 folder
        shell: pwsh
        run: ./publish.ps1 -Version '${{ steps.ver.outputs.version }}' -Runtime linux-x64

      - name: Package tarball
        shell: bash
        run: |
          VER='${{ steps.ver.outputs.version }}'
          NAME="Knotarium-${VER}-linux-x64"
          # Ensure the self-contained apphost is executable inside the archive.
          chmod +x "publish/app/Knotarium.Api"
          mv "publish/app" "publish/${NAME}"
          # tar.gz (not zip) so the executable bit survives extraction on Linux.
          ( cd publish && tar -czf "${NAME}.tar.gz" "${NAME}" && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v7
        with:
          name: knotarium-${{ steps.ver.outputs.version }}-linux-x64
          path: |
            publish/*.tar.gz
            publish/*.tar.gz.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            publish/*.tar.gz
            publish/*.tar.gz.sha256

  # Scans the published artifacts on VirusTotal and appends the multi-engine scan links to the release
  # notes — so users hitting an unsigned-build heuristic warning can see the independent verdict.
  #
  # Opt-in and fail-safe: it does nothing unless a free VirusTotal API key is present in the VT_API_KEY
  # repo secret (https://www.virustotal.com/gui/my-apikey). Without the secret every step is skipped, and
  # the scan step is continue-on-error, so a missing key, a VT outage, or a rate-limit can never fail a
  # release. Runs after both build jobs so it can reach the uploaded artifacts and edit the finished notes.
  virustotal:
    name: VirusTotal scan
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the release notes
      actions: read     # download this run's build artifacts
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Check for a VirusTotal API key
        id: gate
        run: |
          if [ -n "${VT_API_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No VT_API_KEY secret configured; skipping the VirusTotal scan."
          fi

      - name: Download build artifacts
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Scan artifacts with VirusTotal
        id: vt
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true   # a VT outage or rate-limit must never fail a release
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4   # stay within the free public API's 4 lookups/minute
          # Only the distributables, not the tiny .sha256 sidecars. The action uses VirusTotal's
          # large-file upload endpoint, so the ~46-65 MB assets are within limits.
          files: |
            dist/**/*.zip
            dist/**/*setup.exe
            dist/**/*.tar.gz

      - name: Append VirusTotal links to the release notes
        if: steps.gate.outputs.enabled == 'true' && steps.vt.outcome == 'success' && steps.vt.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          # steps.vt.outputs.analysis is "path=url,path=url,…". Append a markdown section to the notes,
          # skipping if a re-run already added one.
          current="$(gh release view "$TAG" --json body -q .body)"
          if printf '%s' "$current" | grep -qF '### VirusTotal scans'; then
            echo "VirusTotal section already present; leaving the notes unchanged."
            exit 0
          fi
          {
            printf '%s\n\n' "$current"
            echo '### VirusTotal scans'
            echo ''
            echo 'Independent multi-engine VirusTotal scans of the artifacts in this release. Unsigned pre-release builds can trigger a heuristic (`!ml`) false-positive on Windows Defender/SmartScreen; verify the published SHA-256 and these scans.'
            echo ''
            IFS=',' read -ra items <<< "$ANALYSIS"
            for item in "${items[@]}"; do
              path="${item%%=*}"
              url="${item##*=}"
              echo "- [\`$(basename "$path")\`]($url)"
            done
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md

  # Builds and pushes a multi-arch (amd64 + arm64) container image to the GitHub Container Registry on a
  # tag push. The build is framework-dependent (arch-neutral IL on the multi-arch aspnet base), so buildx
  # handles both platforms without per-RID gymnastics. A manual workflow_dispatch BUILDS the image (a
  # validation build) but does NOT push. Tagging: every build publishes the exact `:<version>`; `:latest`
  # moves only on a STABLE tag (no hyphen), while pre-releases (rc/beta) also move a rolling `:edge`.
  # No external secret needed — pushes to ghcr.io with the built-in GITHUB_TOKEN. ONE-TIME manual step:
  # after the first push, set the GHCR package visibility to Public in the repo's Packages settings.
  docker:
    name: Build + push Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and image tags
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR requires a lowercase image path
          IMAGE="ghcr.io/${OWNER}/knotarium"
          TAGS="${IMAGE}:${VER}"
          # A hyphen ⇒ pre-release: roll :edge. Otherwise it's stable: roll :latest.
          if [[ "${VER}" == *-* ]]; then
            TAGS="${TAGS},${IMAGE}:edge"
          else
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  winget:
    name: Submit to winget
    # Runs after the Windows job so the setup.exe is already attached to the release — wingetcreate
    # downloads it from the release URL to compute the hash, and gets a 404 if it is not there yet.
    needs: windows
    runs-on: windows-latest
    steps:
      # ── Optional winget community-repo submission ────────────────────────────────────────────────
      # Opens (or updates) a pull request against microsoft/winget-pkgs so `winget install Knotarium`
      # picks up the new version. Opt-in and fail-safe, like the signing hooks above: without the
      # WINGET_PAT secret the job logs a notice and does nothing.
      #
      # PRE-RELEASES ARE SKIPPED ON PURPOSE. The community repo keys upgrades off a single version
      # stream per package identifier, so publishing rc/beta builds under the stable identifier is how
      # you end up dragging users from a stable install onto a release candidate. If pre-releases
      # should be installable, submit them under a separate identifier (the convention Microsoft uses
      # for Microsoft.PowerShell.Preview) rather than mixing them in here.
      #
      # FIRST SUBMISSION IS MANUAL. `wingetcreate update` only works once the package already exists
      # upstream. Seed it once from installer/winget/ — validate with `winget validate installer/winget`,
      # test with winget-pkgs' Tools/SandboxTest.ps1, then open that first PR by hand. Every release
      # after that is handled here.
      #
      # One-time maintainer setup:
      #   1. Create a GitHub personal access token with the `public_repo` scope. It needs to be able to
      #      fork microsoft/winget-pkgs and push a branch to that fork.
      #   2. Add it as the repo secret WINGET_PAT.
      - name: winget gate
        id: winget_gate
        shell: bash
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a tag push; skipping the winget submission."
          elif [[ "${VER}" == *-* ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${VER} is a pre-release; the winget community repo only carries the stable stream for this identifier."
          elif [ -z "${WINGET_PAT}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_PAT not configured; skipping the winget submission."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit manifest update to microsoft/winget-pkgs
        if: steps.winget_gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.winget_gate.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Knotarium-$ver-setup.exe"

          # The installer must be publicly readable before wingetcreate hashes it. The release is
          # published in the job we depend on, but asset propagation is not instantaneous.
          $ready = $false
          foreach ($attempt in 1..10) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch {
              Write-Host "Attempt ${attempt}: installer not reachable yet, waiting 30s..."
              Start-Sleep -Seconds 30
            }
          }
          if (-not $ready) { throw "Release asset never became reachable: $url" }

          # Official Microsoft tool, pinned to the aka.ms redirector Microsoft publishes it under.
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe -UseBasicParsing

          # --submit opens the PR against microsoft/winget-pkgs from a fork owned by the token's account.
          # wingetcreate pulls the current manifest from upstream, bumps the version and re-hashes the
          # installer, so the manifests under installer/winget/ are only the one-time seed.
          .\wingetcreate.exe update AndreKaufmann.Knotarium `
            --version $ver `
            --urls $url `
            --submit `
            --token $env:WINGET_PAT
