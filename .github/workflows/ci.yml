name: CI

# Gates PRs on the backend drift-control / architecture tests
# (Knotarium.Architecture.Tests) so module-boundary drift is caught in
# review instead of only when someone runs the suite locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Apache-2.0 §4(c) only protects copyright notices that exist — this gate makes sure
      # no new first-party source file slips in without one.
      - name: Check SPDX headers
        run: |
          missing=$(find . -type f \( -name '*.cs' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path '*/node_modules/*' -not -path '*/obj/*' -not -path '*/bin/*' \
            -not -path '*/dist/*' -not -path './.git/*' \
            -exec sh -c 'head -c 400 "$1" | grep -q "SPDX-License-Identifier" || echo "$1"' _ {} \;)
          if [ -n "$missing" ]; then
            echo "::error::Source files missing the SPDX license header:"
            echo "$missing"
            echo ""
            echo "Add to the top of each file:"
            echo "// Copyright 2026 Andre Kaufmann"
            echo "// SPDX-License-Identifier: Apache-2.0"
            exit 1
          fi
          echo "All source files carry the SPDX header."

  architecture-tests:
    name: Architecture / drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/Knotarium.Architecture.Tests/Knotarium.Architecture.Tests.csproj

      - name: Run architecture tests
        run: >-
          dotnet test Backend/Knotarium.Architecture.Tests/Knotarium.Architecture.Tests.csproj
          --no-restore
          --configuration Release
          --logger "console;verbosity=normal"

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check + build
        run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # A hang (e.g. a sandbox worker that failed to start) should abort the job in minutes, not sit for
    # the 6-hour default. --blame-hang-timeout below turns a hung test into a diagnostic failure first.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/Knotarium.slnx

      # Build once up front so the test step doesn't build + spawn test hosts at the same time.
      - name: Build
        run: dotnet build Backend/Knotarium.slnx --no-restore --configuration Release

      # The runner has ~7 GB RAM. Running all four test assemblies in parallel, each with xUnit
      # collection-parallelism (plus the sandbox tests spawning worker processes), OOMs the CLR and then
      # a test blocks forever on a worker that never started. Serialize everything and cap the hang.
      - name: Run backend test suite
        run: >-
          dotnet test Backend/Knotarium.slnx
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"
          --blame-hang-timeout 5m
          --
          RunConfiguration.MaxCpuCount=1
          xUnit.parallelizeAssembly=false
          xUnit.parallelizeTestCollections=false
          xUnit.maxParallelThreads=1
