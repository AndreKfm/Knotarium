version: 1
module:
  id: backend.features.compiler
  name: Knotarium.Features.Compiler
  level: application
  path: Backend/Knotarium.Features.Compiler
  owner_role: use-case-and-orchestration
  intention: >-
    Compiles a WorkflowDefinition into an ExecutionPlan: subflow inlining with instance-scoped
    namespacing, manifest/parameter/edge/socket validation, type compatibility, cycle detection,
    and trigger discovery; ships the in-memory built-in node-manifest catalog. Extracted leaf
    slice — depends only on Core contracts and domain.
  allowed_project_dependencies:
    - Knotarium.Core
  forbidden_project_dependencies:
    - Knotarium.Api
    - Knotarium.Infrastructure
    - Knotarium.NodeRuntime
    - Knotarium.Features
  component_map:
    - path: Backend/Knotarium.Features.Compiler
      architecture_level: Application / Feature Slice
      intention: Workflow validation and compilation into executable plans.
      viable_changes:
        - Compilation rules
        - Diagnostics
        - Plan construction
        - Schema validation
  place_here_when:
    - The change validates or compiles workflows into execution plans.
    - The change defines the built-in node manifest catalog.
  do_not_place_here:
    - Node-task execution behavior (belongs in the Nodes slice)
    - Persistence or runtime concerns
